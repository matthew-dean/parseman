name: CI

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` are here because the release gate's escape hatch reads a
    # LABEL (`release-exempt`, see scripts/check-changelog.mjs). The default type set
    # is [opened, synchronize, reopened], so applying the label fired no event and a
    # re-run replays the original payload with the label absent — observed as
    # `EXEMPT: false` in a job whose PR was already labelled. The hatch was therefore
    # unreachable except by pushing a commit AFTER labelling, which is not what its
    # documentation says and not what anyone would try.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Least privilege: nothing here writes to the repo. Every step only reads the
# checkout; the coverage artifact is uploaded through the Actions API, which does
# not need `contents: write`.
permissions:
  contents: read

jobs:
  # Which KIND of change is this? Used only to skip the heavy matrix for
  # documentation-only PRs.
  #
  # Deliberately a job output rather than a workflow-level `paths-ignore`. A
  # workflow that does not TRIGGER never reports its contexts at all, and `test`
  # is a required check on `main` — so `paths-ignore` here would leave every
  # docs-only PR permanently blocked waiting for a check that will never arrive.
  # Same trap as renaming the job (see the `test` job below): the fix is to keep
  # the workflow running and skip work inside it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: Detect whether anything outside docs changed
        run: |
          set -euo pipefail
          # Pushes to main always run everything: there is no reliable "base" to
          # diff a merge commit against, and main is the branch that must stay green.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "push event — running everything"
            exit 0
          fi
          files=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          # Anything that is NOT markdown or under docs/ counts as code.
          #
          # `.github/` counts as code — a workflow change must run the full suite.
          #
          # CHANGELOG.md counts as code. The changelog itself is now validated by the
          # `release-gate` job, which is never skipped, so this no longer protects the
          # changelog check — it protects the SUITE: a changelog entry is a claim about
          # behaviour, and the version bump that accompanies it lands in `src/version.ts`,
          # which the artifact version lock reads. A release commit must be tested.
          # `.github/` is tested BEFORE the markdown exemption on purpose: an
          # issue template or workflow README lives under `.github/**` AND ends in
          # `.md`, so a single broad `\.md$` exemption would let it skip the matrix
          # despite the .github rule directly above.
          if echo "$files" | grep -qE '^(\.github/|CHANGELOG\.md$)' \
             || echo "$files" | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation-only change — skipping the Node matrix"
          fi

  # Executes every `// [verify]` example in the guide and compares its real output
  # to the `// →` line pasted beneath it.
  #
  # Runs on EVERY change, not just doc changes: the examples execute real parseman
  # code, so a change to `src/` can invalidate a documented output just as easily
  # as editing the prose can. It was previously in no automated check at all —
  # neither CI nor the pre-commit hook — which made the guide's own claim ("if the
  # engine changes, the check fails") true only when someone remembered to run it.
  docs-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify documented examples
        run: pnpm docs:verify

  # Release gate — is this change RELEASABLE the moment it merges?
  #
  # `scripts/check-changelog.mjs` used to run only as `prepublishOnly`. It refused a
  # `## Unreleased` top section at PUBLISH time, which is the last moment it can
  # matter and long after the PR that caused it has merged. Every PR was free to
  # leave `main` merged-but-unshippable, and three consecutive releases went out
  # through that gap — the 0.36.0 content sat on `main` under a heading naming no
  # version at all. So the check moved LEFT, to here.
  #
  # It asserts (a) the changelog's first `##` heading names a version, at or above
  # package.json's, with `src/version.ts`'s stamp equal to package.json's; and (b) if
  # the diff touches the PUBLISHED SURFACE (`src/**`, or a consumer-facing package.json
  # field) that heading names a version which is NOT yet published — an open section.
  # Everything that cannot reach a consumer — tests, benches, scripts, docs, this file,
  # the lockfile — is exempt from (b) on purpose: a gate that fires on a comment typo
  # gets bypassed, and then the gates that matter get bypassed with it.
  #
  # (b) is CHANGELOG-relative, not branch-relative. It used to require package.json to
  # go up against the PR base, which made a version number the price of MERGING while
  # this project spends numbers at PUBLISH — so between two releases every PR burned a
  # number and all but the last collapsed (0.37 through 0.41 shipped as one 0.37.0).
  # Now `main` carries one open section, every PR files into it, and the bump comes due
  # at `npm publish`, where `prepublishOnly --publish` requires all three to converge.
  #
  # Its own job rather than a matrix step, for two reasons. It needs `fetch-depth: 0`
  # to see the base commit, which the matrix deliberately does not take. And it must
  # run on EVERY PR including documentation-only ones — (a) has no exemption at any
  # version, so unlike the matrix it is never skipped. It needs no install: the script
  # is dependency-free Node.
  #
  # The hatch is the `release-exempt` LABEL, passed through below. It waives (b) only,
  # for a revert of a release or a PR chained on one that already bumped, and it does
  # so visibly on the PR instead of in someone's `--no-verify`.
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # This job reads history and pushes nothing, so the token has no reason to
          # survive into the step that runs the gate. Every git call the script makes
          # (`merge-base`, `diff`, `show`) is local to the checkout.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Changelog section and version bump
        env:
          # `pull_request` only. On a push to `main` there is no base to diff and no
          # label to read, so the script runs release-integrity alone — which is the
          # backstop that catches anything merged around this gate.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'release-exempt') }}
        run: |
          set -euo pipefail
          # `if`, not `[ … ] && …`: under `set -e` a trailing test that evaluates
          # false IS the step's exit status, so the short-circuit form would fail the
          # job precisely when the PR is unlabelled — the common case.
          args=()
          if [ -n "$BASE_SHA" ]; then args+=("--base=$BASE_SHA"); fi
          if [ "$EXEMPT" = "true" ]; then args+=("--exempt"); fi
          node scripts/check-changelog.mjs ${args[@]+"${args[@]}"}

  test-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One leg per SUPPORTED LTS line, matching `engines`
      # (`^20.19.0 || >=22.12.0`): today 24 / 22 / 20.
      #
      # The two upper legs are ALIASES so they follow Node instead of rotting —
      # when the next line goes LTS they shift on their own.
      #
      # The FLOOR leg is PINNED, and deliberately not `lts/-2`. An alias tracks a
      # moving window; `engines` states a fixed contract. The moment Node 26 becomes
      # the current LTS, `lts/-2` resolves to 22 and Node 20 stops being tested
      # while `^20.19.0` still promises it — the matrix would drift off the contract
      # silently, in the opposite direction from stale pins. Pinning the boundary is
      # the only leg where the exact version is the point: it is the literal claim
      # the manifest makes. The upper lines have no such boundary to verify.
      #
      # A single pinned major — what this was — tests neither end of the range and
      # let a real bug through: `case-fold.test.ts` pinned a Unicode-derived count
      # that is 2313 on Node 22 and 2307 on Node 24, so it passed locally and failed
      # CI. Anything ICU-, Intl- or Unicode-derived drifts silently between lines.
      matrix:
        node-version: ['lts/*', 'lts/-1', '20.19.0']
    name: test (node ${{ matrix.node-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from the "packageManager" field in package.json, so CI
        # always matches the lockfile format used locally.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        # The `prepare` lifecycle script builds dist/ after install, so the
        # package self-reference ('parseman') resolves for the typecheck step
        # (test fixtures import it as a real consumer would). No separate build
        # step needed here.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Control-byte check
        # Raw control bytes in a source file make it BINARY: `git diff --numstat`
        # reports `- -`, GitHub will not render the blob, and `grep -rn` skips it
        # SILENTLY. It has happened twice (ed81612 fixed it in analysis/, and it
        # came back in compiler/degradation.ts), so it is gated rather than
        # remembered. See scripts/check-control-bytes.mjs.
        run: pnpm check:control-bytes

      - name: Test with coverage
        # Uses vitest.coverage.config.ts, which excludes all of test/perf/ —
        # those are timing-based benchmarks, not unit tests, and running them
        # under coverage instrumentation only adds noise to their timings
        # without adding any coverage. Plain `pnpm test` still runs them.
        run: pnpm test:coverage

      - name: Coverage guard
        # Ratchet, not a fixed threshold: fails only if coverage drops below
        # scripts/coverage-baseline.json (see that file / scripts/coverage-guard.mjs).
        # No-ops with a warning until a baseline exists — run
        # `pnpm coverage:baseline` locally and commit the result to turn this on.
        run: pnpm coverage:guard

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ strategy.job-index }}
          path: coverage/
          retention-days: 14

  # Grammar perf gate — did the code parseman EMITS get slower?
  #
  # `perf:guard` (inside the matrix) measures 47-byte microbenchmarks. It passed on
  # every PR of the 0.34.0 cycle while a real Less grammar got 25% slower. This job
  # measures a rollback-density sweep instead — see docs/design/perf-gates.md.
  #
  # It runs on EVERY code PR rather than nightly or at release, because it costs
  # ~1.5-2 min locally and stays well inside this job's budget. Speed is a
  # correctness property: a gate too slow to run gets skipped, and then everything
  # gets skipped with it. That cost went up at 0.46.0 and bought the gate's
  # honesty — 5 passes instead of 3, both sides RECOMPILED per pass so the passes
  # are independent at all, and a control pair measuring the null win rate.
  #
  # It is a REQUIRED check by way of the `test` aggregate below, not merely a
  # report. A perf gate nobody has to satisfy is a dashboard.
  #
  # Shared-runner noise is handled by the measurement, not by a loose threshold:
  # both sides are interleaved in ONE process with per-round rotation, so there is
  # no cross-machine term, and a case fails only when it also loses 3/4 of its
  # paired samples.
  grammar-perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the gate builds the reference side from a sha pinned in
          # bench/grammar-density/config.json, and a shallow clone cannot see it.
          # A missing reference is a hard failure, never a skip.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rollback-density perf gate vs the pinned reference commit
        run: pnpm perf:guard:grammars

  # Broad workload perf gate — did realistic parsing get slower, on ANY axis?
  #
  # `grammar-perf` above sweeps two axes and thresholds each. That is the right
  # shape for attributing a regression and the wrong shape for finding one: it
  # shipped with a rollback sweep, and `fix(expect)` regressed expected-set width
  # straight through it in the very next PR. A targeted gate can only ever catch
  # the regression someone already thought of.
  #
  # This job parses realistic stylesheets, documents and payloads end to end and
  # thresholds each workload on its own, so a cost on any axis shows up as time.
  # It is separate from `grammar-perf` rather than folded into it because the two
  # answer different questions and a reader should be able to see which one went
  # red: this one says "downstream got slower", that one says "and here is the
  # axis".
  #
  # Runs on EVERY code PR. It costs ~2.5-3 min here — five independent measurement
  # passes, each recompiling both sides, plus a control pair that measures the null
  # win rate, so neither a busy runner nor a bad draw of the compilation lottery can
  # fail a PR on its own. See docs/design/perf-gates.md for what it can and cannot see.
  workload-perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the gate builds the reference side from a sha pinned in
          # bench/workloads/config.json, and a shallow clone cannot see it.
          # A missing reference is a hard failure, never a skip.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Realistic-workload perf gate vs the pinned reference commit
        run: pnpm perf:workloads
      # The PEAK clause — the same workloads against the fastest release ON RECORD
      # rather than the previous one. The step above enforces "faster than the last
      # release"; this one enforces "not below the best we have ever been", which is
      # the half a per-step comparison structurally cannot see: five consecutive 1%
      # losses each sit inside the noise floor, no step is flagged, and the sum is
      # real. Measured at -5.1% accumulating across 0.28.0 -> 0.34.0 on the
      # standalone sweep.
      #
      # Same job, so it reuses the checkout, the install and the warm .cache
      # worktrees rather than paying for a second runner.
      - name: Peak clause — no drawdown from the fastest release on record
        run: pnpm perf:workloads:peak

  # Code-size gate. On the same footing as the two perf gates, because until it
  # existed size had NO gate at all: `bench:size` lived in package.json and in
  # zero workflows, so the code-size budget published in docs/guide/macro-mode.md
  # was a hand-run snapshot that nothing enforced. It drifted by roughly an order
  # of magnitude on real grammars without anything going red.
  #
  # Two blocking checks (see bench/size-guard.ts for the reasoning):
  #   CEILING — 10x raw generated bytes per source byte, the owner's stated
  #             budget. No waiver; a rebaseline CANNOT raise a fixture above it.
  #   DRIFT   — 1% against a COMMITTED ABSOLUTE baseline (bench/size-baseline.json),
  #             not a differential against the parent commit. Gating each commit
  #             against its parent lets +2%/commit land forever.
  #
  # No `fetch-depth: 0`: unlike the perf gates this one has no reference commit to
  # build — the baseline is a committed file, so a shallow clone is sufficient.
  # Fast (~1 min): it compiles grammars, it does not time anything, so it needs no
  # repeated measurement passes.
  size-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Code-size gate vs the committed absolute baseline
        run: pnpm size:guard

  # GRAMMAR WASTED-WORK GATE (bench/choice-cost-guard.ts)
  #
  # Counts the input bytes a grammar re-scans after an ordered-choice arm was
  # tried and failed, over `bench/workloads/fixtures/{site.css,app.less}` — the
  # same hand-authored corpus the workload perf gate already replays.
  #
  # This is NOT a third perf gate. Wasted bytes rank grammar ORDERING, not CPU:
  # the jess lane that acted on this instrument's headline finding cut rescanned
  # bytes 69.8% and measured zero wall-clock change. What it stops is grammar
  # SHAPE rotting — an arm migrating to the front of a hot choice, a fifth
  # alternative added to a site entered a million times — which no timing gate
  # resolves and no reviewer reliably notices in a diff.
  #
  # It is also the CHEAPEST gate here, and the only deterministic one. The metric
  # is a COUNT, not a timing: byte-identical across separate processes (asserted
  # by test/unit/choice-cost.test.ts), so unlike `grammar-perf` and
  # `workload-perf` it needs no reference commit, no repeated passes and no
  # `fetch-depth: 0` — just the committed baseline and one interpreted parse of
  # ~33 kB. Seconds, not minutes.
  #
  # Blocking checks (see bench/choice-cost-guard.ts for the reasoning):
  #   RATCHET    — TWO-SIDED against bench/choice-cost-baseline.json at ±0.1%.
  #                Growing fails; an UNBANKED WIN also fails, because headroom
  #                left on the table becomes budget for the next regression.
  #   INVERSIONS — an arm that failed every attempt while a later arm matched.
  #                On from day one: both gated grammars measure ZERO today, so
  #                this keeps an empty backlog empty rather than arriving red.
  choice-cost-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Grammar wasted-work gate vs the committed absolute baseline
        run: pnpm choicecost:guard

  # The single required status check. The ruleset on `main` requires a context
  # named exactly `test`; a matrix job publishes one context PER LEG
  # (`test (node lts/*)`, …) and none named `test`, so making the matrix the
  # required check would block every PR forever — which is exactly what happened
  # on the first run of this one.
  #
  # This job keeps that name stable no matter how the matrix changes: it is green
  # only when every leg succeeded, so coverage is not weakened by the indirection.
  # `if: always()` is required — without it a failed leg would SKIP this job, and a
  # skipped required check reads as "not failed" rather than as a failure.
  test:
    needs: [changes, test-matrix, docs-verify, grammar-perf, release-gate, workload-perf, size-gate, choice-cost-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required work succeeded
        run: |
          set -euo pipefail
          matrix='${{ needs.test-matrix.result }}'
          docs='${{ needs.docs-verify.result }}'
          perf='${{ needs.grammar-perf.result }}'
          release='${{ needs.release-gate.result }}'
          workload='${{ needs.workload-perf.result }}'
          size='${{ needs.size-gate.result }}'
          choicecost='${{ needs.choice-cost-gate.result }}'
          code='${{ needs.changes.outputs.code }}'
          echo "test-matrix=$matrix  docs-verify=$docs  grammar-perf=$perf  release-gate=$release  workload-perf=$workload  size-gate=$size  choice-cost-gate=$choicecost  code-changed=$code"

          # docs-verify gates every change — it is never skipped.
          [ "$docs" = "success" ] || { echo "::error::docs:verify did not pass"; exit 1; }

          # Nor is the release gate, at any version, for any kind of change. A
          # documentation-only PR still may not leave the changelog headless. `success`
          # is the ONLY accepted result here — there is no skip case to whitelist, so
          # a skip from any cause fails rather than sliding through as "not failed".
          [ "$release" = "success" ] || { echo "::error::release-gate did not pass ($release)"; exit 1; }

          case "$matrix" in
            success) ;;
            # A documentation-only PR skips the matrix ON PURPOSE. Accept that
            # exactly once — and only when `changes` actually said so, so a matrix
            # skipped for any OTHER reason still fails this gate rather than
            # sliding through as "not failed".
            skipped)
              [ "$code" = "false" ] || { echo "::error::matrix skipped but code changed"; exit 1; }
              echo "documentation-only change — Node matrix intentionally skipped" ;;
            *) echo "::error::test-matrix result: $matrix"; exit 1 ;;
          esac

          # Same rule for the grammar perf gate: skipped is acceptable ONLY for a
          # documentation-only PR. Anything else — failure, cancellation, or a skip
          # from some other cause — fails the required check rather than sliding
          # through as "not failed". That is what makes this gate block rather than
          # report.
          case "$perf" in
            success) ;;
            skipped)
              [ "$code" = "false" ] || { echo "::error::grammar-perf skipped but code changed"; exit 1; }
              echo "documentation-only change — grammar perf gate intentionally skipped" ;;
            *) echo "::error::grammar-perf result: $perf"; exit 1 ;;
          esac

          # And the same rule again for the broad workload gate. Two perf gates,
          # two independent required results: a green here must mean BOTH ran.
          case "$workload" in
            success) ;;
            skipped)
              [ "$code" = "false" ] || { echo "::error::workload-perf skipped but code changed"; exit 1; }
              echo "documentation-only change — workload perf gate intentionally skipped" ;;
            *) echo "::error::workload-perf result: $workload"; exit 1 ;;
          esac

          # And the size gate, on the same footing. Speed had two required results
          # and size had none, which is why the published code-size budget drifted
          # by an order of magnitude unnoticed. Same skip rule: acceptable ONLY for
          # a documentation-only PR, so a green here must mean size was measured.
          case "$size" in
            success) ;;
            skipped)
              [ "$code" = "false" ] || { echo "::error::size-gate skipped but code changed"; exit 1; }
              echo "documentation-only change — size gate intentionally skipped" ;;
            *) echo "::error::size-gate result: $size"; exit 1 ;;
          esac

          # And the grammar wasted-work gate. Same skip rule as every other gate
          # here: acceptable ONLY for a documentation-only PR, so a green on this
          # required check means grammar ordering cost was actually measured and
          # not merely not-failed.
          case "$choicecost" in
            success) ;;
            skipped)
              [ "$code" = "false" ] || { echo "::error::choice-cost-gate skipped but code changed"; exit 1; }
              echo "documentation-only change — grammar wasted-work gate intentionally skipped" ;;
            *) echo "::error::choice-cost-gate result: $choicecost"; exit 1 ;;
          esac
