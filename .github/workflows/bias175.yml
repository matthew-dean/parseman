          - { kind: mixture, job: 19 }
          - { kind: mixture, job: 20 }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: lscpu | grep -E 'Model name'; node -v
      - name: one shard
        run: |
          REF=$(git rev-parse --short=8 origin/main)
          case "${{ matrix.kind }}" in
            uniform) node bench/experiments/plant175.mjs uniform 0.66 ;;
            token) node bench/experiments/plant175.mjs token 3 ;;
            mixture) node bench/experiments/plant175.mjs mixture 6 ;;
          esac
          time pnpm perf:xproc:gate --ref=$REF --shard-out=shard.json 2>&1 | grep -E '^\s+(ok|FAIL) |^ROWS|seed|Error|refusing|exited'
