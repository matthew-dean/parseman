name: bias175-experiment
on:
  push:
    branches: ['exp/bias175*']
permissions:
  contents: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: token, k: 8, job: 1 }
          - { kind: token, k: 8, job: 2 }
          - { kind: token, k: 8, job: 3 }
          - { kind: token, k: 8, job: 4 }
          - { kind: token, k: 16, job: 1 }
          - { kind: token, k: 16, job: 2 }
          - { kind: token, k: 16, job: 3 }
          - { kind: token, k: 16, job: 4 }
          - { kind: token, k: 32, job: 1 }
          - { kind: token, k: 32, job: 2 }
          - { kind: token, k: 32, job: 3 }
          - { kind: token, k: 32, job: 4 }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: lscpu | grep -E 'Model name'; node -v
      - name: one shard
        run: |
          REF=$(git rev-parse --short=8 origin/main)
          case "${{ matrix.kind }}" in
            uniform) node bench/experiments/plant175.mjs uniform 0.66 ;;
            token) node bench/experiments/plant175.mjs token ${{ matrix.k }} ;;
            mixture) node bench/experiments/plant175.mjs mixture 6 ;;
          esac
          time pnpm perf:xproc:gate --ref=$REF --suite=workloads --rounds=10 --shard-out=shard.json 2>&1 | grep -E '^\s+(ok|FAIL) |^ROWS|seed|Error|refusing|exited'
